version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: velvet_postgres
    environment:
      POSTGRES_USER: velvet
      POSTGRES_PASSWORD: velvet_password
      POSTGRES_DB: velvet_db
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - velvet_network

  redis:
    image: redis:7-alpine
    container_name: velvet_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - velvet_network

networks:
  velvet_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
